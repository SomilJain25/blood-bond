<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital / Blood Bank Registration — BloodBond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/shared.css" />

  
  <style>
    .reg-page { padding-top: calc(var(--nav-h) + 2rem); padding-bottom: 4rem; }
    .reg-wrap { max-width: 680px; margin: 0 auto; padding: 0 1.5rem; }
    .reg-header { text-align: center; margin-bottom: 2.5rem; }
    .reg-title { font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 900; color: var(--text); margin-bottom: 0.5rem; }
    .reg-title em { font-style: italic; color: var(--red-bright); }

    .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-bottom: 1rem; }
    .form-section-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; }

    .location-row { display: flex; gap: 10px; }
    .location-row .form-control { flex: 1; }
    .locate-btn {
      padding: 0 16px; border-radius: var(--radius-sm);
      background: var(--ink-3); border: 1px solid var(--border);
      color: var(--text-dim); cursor: pointer; font-size: 0.8rem; white-space: nowrap;
      transition: border-color 0.2s, color 0.2s;
    }
    .locate-btn:hover { border-color: var(--border-red); color: var(--text); }

    .consent-box { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--ink-3); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; margin-top: 1rem; }
    .consent-box input { accent-color: var(--red); flex-shrink: 0; margin-top: 2px; }
    .consent-box label { font-size: 0.82rem; color: var(--text-dim); cursor: pointer; }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><span class="logo-drop">🩸</span><span>Blood<em>Bond</em></span></a>
      <div class="nav-right">
        <button type="button" class="theme-toggle" aria-label="Toggle theme">Light mode</button>
        <a href="role.html" class="btn-nav-outline">← Change role</a>
      </div>
    </div>
  </header>

  <div class="reg-page">
    <div class="reg-wrap">

      <div class="reg-header" data-reveal>
        <p class="section-label">— Hospital / Blood Bank Registration</p>
        <h1 class="reg-title">Register your<br /><em>hospital / blood bank</em></h1>
        <p style="font-size:0.85rem;color:var(--text-muted);">BloodBond — verified hospitals and blood banks can request blood and track donors in real time.</p>
      </div>

      <div class="form-section" data-reveal data-reveal-delay="1">
        <div class="form-section-title"><span>🏥</span> Facility Details</div>
        <div class="form-group">
          <label class="form-label">Hospital / Blood Bank Name <span class="req">*</span></label>
          <input type="text" class="form-control" id="hname" placeholder="Enter hospital or blood bank name" />
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Hospital executive <span class="req">*</span></label>
            <input type="text" class="form-control" id="hcontact" placeholder="Name of executive" />
          </div>
          <div class="form-group">
            <label class="form-label">Designation</label>
            <input type="text" class="form-control" id="hdesg" placeholder="e.g -: Blood Bank In-Charge" />
          </div>
          <div class="form-group">
            <label class="form-label">Phone No. <span class="req">*</span></label>
            <input type="tel" class="form-control" id="hphone" placeholder="Enter phone no" />
          </div>
          <div class="form-group">
            <label class="form-label">Facility Type</label>
            <select class="form-control" id="htype">
              <option>Government Hospital</option>
              <option>Private Hospital</option>
              <option>Blood Bank</option>
              <option>Nursing Home</option>
              <option>Clinic</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-section" data-reveal data-reveal-delay="2">
        <div class="form-section-title"><span>📍</span> Location</div>
        <div class="form-group">
          <label class="form-label">Address <span class="req">*</span></label>
          <input type="text" class="form-control" id="haddr" placeholder="Hospital Name, Area, Landmark" />
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">City <span class="req">*</span></label>
            <input type="text" class="form-control" id="hcity" placeholder="e.g. Gwalior" />
          </div>
          <div class="form-group">
            <label class="form-label">Area / Zone</label>
            <input type="text" class="form-control" id="harea" placeholder="Enter area or zone" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">GPS Location</label>
          <div class="location-row">
            <input type="text" class="form-control" id="hgps" placeholder="Auto-detect" readonly />
            <button type="button" class="locate-btn" onclick="autoLocate()" aria-label="Detect GPS location">📍 Detect GPS</button>
          </div>
        </div>

        <div class="consent-box">
          <input type="checkbox" id="hconsent" />
          <label for="hconsent">I confirm this hospital or blood bank is a registered medical institution and agree that misuse of this platform for invalid blood requests will result in account suspension.</label>
        </div>
      </div>

      <button type="button" class="btn btn-primary btn-full btn-lg" onclick="submitHospital()" data-reveal data-reveal-delay="3">
        Register Hospital / Blood Bank →
      </button>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="../JS/auth.js"></script>
  <script>

    
    function autoLocate() {
      const btn = document.querySelector('.locate-btn');
      if (!navigator.geolocation) { toast('Geolocation is not supported by this browser', 'error'); return; }
      btn.textContent = '⏳ Locating...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6), lng = pos.coords.longitude.toFixed(6);
          document.getElementById('hgps').value = lat + ', ' + lng;
          btn.textContent = '✓ Located';
          toast('GPS coordinates captured');
        },
        (err) => {
          btn.textContent = '📍 Detect GPS';
          toast(err.code === 1 ? 'Location permission denied' : 'Could not get your location', 'error');
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    function submitHospital() {
      const name = document.getElementById('hname').value.trim();
      const phone = Auth.normalizePhone(document.getElementById('hphone').value);
      const contact = document.getElementById('hcontact').value.trim();
      const address = document.getElementById('haddr').value.trim();
      const city = document.getElementById('hcity').value.trim();
      if (!name) { toast('Enter hospital / blood bank name', 'error'); return; }
      if (!contact) { toast('Enter hospital executive name', 'error'); return; }
      if (!/^\d{10}$/.test(phone)) { toast('Enter a valid 10-digit phone', 'error'); return; }
      if (!address) { toast('Enter address', 'error'); return; }
      if (!city) { toast('Enter city', 'error'); return; }
      if (!document.getElementById('hconsent').checked) { toast('Please confirm consent', 'error'); return; }

      const btn = document.querySelector('.btn-primary');
      btn.textContent = '⏳ Preparing...';
      btn.disabled = true;
      const payload = {
        facility_name: name,
        contact_person: contact,
        designation: (document.getElementById('hdesg').value || '').trim() || null,
        facility_type: (document.getElementById('htype').value || '').trim() || null,
        address: address,
        city: city,
        area: (document.getElementById('harea').value || '').trim() || null,
        gps_text: (document.getElementById('hgps').value || '').trim() || null,
        consent: !!document.getElementById('hconsent').checked
      };
      const gps = (payload.gps_text || '').match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
      if (gps) { payload.latitude = parseFloat(gps[1]); payload.longitude = parseFloat(gps[2]); }
      sessionStorage.setItem('bc_pending_role', 'hospital');
      sessionStorage.setItem('bc_pending_phone', phone);
      sessionStorage.setItem('bc_pending_profile', JSON.stringify({ type: 'hospital', payload: payload }));
      toast('Profile queued. Verify phone to activate hospital account.');
      setTimeout(() => { window.location.href = 'login.html?mode=verify&role=hospital'; }, 700);
    }

    function toast(msg, type = 'success') {
      const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
      document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
    }

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); obs.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('[data-reveal]').forEach(el => obs.observe(el));
  </script>
  <script src="../JS/shared-theme.js"></script>
</body>
</html>

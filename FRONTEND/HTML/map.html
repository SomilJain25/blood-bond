<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map View — BloodBond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/shared.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

  

  <style>
    body { overflow: hidden; }
    .map-page { display: grid; grid-template-columns: 320px 1fr; height: 100vh; padding-top: var(--nav-h); }

    .map-sidebar {
      background: var(--ink-2); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 1.5rem 0;
    }
    .ms-head {
      padding: 0 1.25rem 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
    }
    .ms-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .ms-sub   { font-size: 0.75rem; color: var(--text-muted); }

    .ms-filter {
      display: flex; gap: 6px; padding: 0 1.25rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .filter-chip {
      padding: 5px 12px; border-radius: 40px; font-size: 0.72rem; font-weight: 600;
      border: 1px solid var(--border); background: var(--ink-3); color: var(--text-muted);
      cursor: pointer; transition: all 0.2s; font-family: var(--font-mono);
    }
    button.filter-chip {
      font: inherit;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    .filter-chip.active, .filter-chip:hover {
      border-color: var(--border-red); color: var(--red-bright);
      background: rgba(200,16,46,0.08);
    }

    .donor-pin-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 1.25rem; cursor: pointer; transition: background 0.2s;
    }
    button.donor-pin-item {
      width: 100%;
      font: inherit;
      color: inherit;
      text-align: left;
      border: none;
      background: transparent;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    .donor-pin-item:hover { background: rgba(255,255,255,0.02); }
    .donor-pin-item.selected { background: rgba(200,16,46,0.06); }
    .pin-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .pin-dot.available { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .pin-dot.busy      { background: var(--orange); }
    .pin-dot.offline   { background: var(--text-muted); }
    .pin-body { flex: 1; }
    .pin-name { font-size: 0.83rem; font-weight: 600; color: var(--text); }
    .pin-meta { font-size: 0.72rem; color: var(--text-muted); }
    .pin-dist { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0; }

    .section-divider { padding: 0.5rem 1.25rem; }
    .section-divider span { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-mono); }

    .map-container { position: relative; background: var(--ink-3); }
    .map-placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      background: var(--ink-3);
    }

    
    .fake-map {
      position: absolute; inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.008) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.008) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
      background-color: var(--ink-3);
    }
    
    .fake-map::before {
      content: '';
      position: absolute; inset: 0;
      background:
        linear-gradient(transparent 49%, rgba(255,255,255,0.035) 49%, rgba(255,255,255,0.035) 51%, transparent 51%),
        linear-gradient(90deg, transparent 29%, rgba(255,255,255,0.035) 29%, rgba(255,255,255,0.035) 31%, transparent 31%),
        linear-gradient(90deg, transparent 69%, rgba(255,255,255,0.025) 69%, rgba(255,255,255,0.025) 71%, transparent 71%),
        linear-gradient(transparent 74%, rgba(255,255,255,0.025) 74%, rgba(255,255,255,0.025) 76%, transparent 76%);
    }

    
    #leafletMap { position: absolute; inset: 0; z-index: 1; background: var(--ink-3); }
    .map-overlay { position: absolute; inset: 0; z-index: 1000; pointer-events: none; }
    .map-overlay .map-topbar, .map-overlay .legend { pointer-events: auto; }
    .bb-pin { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%;
      font-size:1rem; border:2px solid var(--red-bright); background: var(--red); box-shadow: 0 0 14px rgba(200,16,46,0.55); color:#fff; }
    .bb-req { font-size:0.7rem; font-weight:700; font-family: var(--font-mono); background: var(--red-bright); }
    .bb-pop { font-family: var(--font-sans, inherit); min-width: 150px; }
    .bb-pop b { display:block; margin-bottom:2px; }
    .bb-pop small { display:block; color:#667; margin-bottom:6px; }
    .bb-pop a { font-size:0.75rem; }
    .map-empty { padding: 0 1.25rem; font-size: 0.8rem; color: var(--text-muted); }

    
    .map-marker {
      position: absolute; transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center; cursor: pointer;
    }
    button.map-marker {
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    .marker-icon {
      width: 36px; height: 36px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .marker-icon-inner { transform: rotate(45deg); }
    .marker-label {
      margin-top: 4px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 7px; font-size: 0.65rem; white-space: nowrap; color: var(--text);
    }
    .marker-hospital .marker-icon { background: var(--red); border: 2px solid var(--red-bright); box-shadow: 0 0 16px rgba(200,16,46,0.6); }
    .marker-donor .marker-icon { background: rgba(29,185,84,0.3); border: 2px solid var(--green); box-shadow: 0 0 10px rgba(29,185,84,0.4); }

   
    .radius-circle {
      position: absolute; border-radius: 50%;
      border: 1px dashed rgba(200,16,46,0.25);
      transform: translate(-50%, -50%); pointer-events: none;
    }

   
    .map-topbar {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
      display: flex; gap: 10px; align-items: center;
    }
    .map-search {
      flex: 1; max-width: 280px; padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-sans);
      font-size: 0.85rem; outline: none;
    }
    .map-search:focus { border-color: var(--red); }
    .map-search::placeholder { color: var(--text-muted); }
    .map-badge {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 14px;
      font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono);
      display: flex; align-items: center; gap: 6px;
    }

    
    .donor-popup {
      position: absolute; z-index: 20; background: var(--ink-2);
      border: 1px solid var(--border-red); border-radius: var(--radius);
      padding: 1rem 1.2rem; min-width: 200px; pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
    }
    .donor-popup.show { opacity: 1; }

    @media(max-width: 768px) {
      body { overflow: auto; }
      .map-page { grid-template-columns: 1fr; height: auto; }
      .map-container { height: 50vh; }
      .map-sidebar { height: auto; overflow: visible; }
    }

    .legend {
      position: absolute; bottom: 16px; right: 16px; z-index: 10;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .leg-item { display: flex; align-items: center; gap: 7px; font-size: 0.72rem; color: var(--text-muted); }
    .leg-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><span class="logo-drop">🩸</span><span>Blood<em>Bond</em></span></a>
      <div class="nav-right">
        <button type="button" class="theme-toggle" aria-label="Toggle theme">Light mode</button>
        <a href="hospital-dashboard.html" class="btn-nav-outline">← Dashboard</a>
      </div>
    </div>
  </header>

  <div class="map-page">

    
    <div class="map-sidebar">
      <div class="ms-head">
        <div class="ms-title">BloodBond — donors near you</div>
        <div class="ms-sub" id="donorCount">Loading donors…</div>
      </div>

      <div class="ms-filter" role="toolbar" aria-label="Filter donors on map">
        <button type="button" class="filter-chip active" onclick="filterMap('all', this)" aria-pressed="true">All</button>
        <button type="button" class="filter-chip" onclick="filterMap('available', this)" aria-pressed="false">Available</button>
        <button type="button" class="filter-chip" onclick="filterMap('critical', this)" aria-pressed="false">O−</button>
        <button type="button" class="filter-chip" onclick="filterMap('nearby', this)" aria-pressed="false">Under 2 km</button>
      </div>

      
      <div id="activeReqBox" style="display:none;margin: 0 1.25rem 1rem; padding: 10px 12px; background: rgba(200,16,46,0.06); border: 1px solid var(--border-red); border-radius: var(--radius-sm);">
        <div style="font-size:0.72rem;color:var(--red-bright);font-family:var(--font-mono);font-weight:600;margin-bottom:3px;">🚨 ACTIVE REQUEST</div>
        <div id="arTitle" style="font-size:0.82rem;color:var(--text);"></div>
        <div id="arMeta" style="font-size:0.72rem;color:var(--text-muted);"></div>
      </div>

      <div class="section-divider"><span>Available donors</span></div>
      <div id="donorList">
      </div>
    </div>

    
    <div class="map-container">
      <div id="leafletMap" role="application" aria-label="Map of donors, hospitals and active requests"></div>
      <div class="map-overlay">

        
        <div class="map-topbar">
          <input class="map-search" id="mapSearch" type="search" placeholder="Search area or blood group…" aria-label="Search donors by area or blood group" />
          <div class="map-badge"><span class="status-dot online"></span> <span id="liveBadge">Live</span></div>
          <div class="map-badge" id="cityBadge">📍 —</div>
        </div>

        
        <div class="legend">
          <div class="leg-item"><div class="leg-dot" style="background:var(--green);box-shadow:0 0 6px var(--green);"></div>Available donor</div>
          <div class="leg-item"><div class="leg-dot" style="background:var(--text-muted);"></div>Offline donor</div>
          <div class="leg-item"><div class="leg-dot" style="background:var(--red-bright);box-shadow:0 0 6px var(--red-bright);"></div>Hospital / Request</div>
          <div style="margin-top:4px;padding-top:6px;border-top:1px solid var(--border);">
            <div class="leg-item" style="font-family:var(--font-mono);">— 5 km radius</div>
            <div class="leg-item" style="font-family:var(--font-mono);">— — 10 km radius</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="../JS/auth.js"></script>
  <script>
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let map, layer, data = null, activeFilter = 'all', query = '', firstFit = true;
    const markerFor = new Map();

    function pretty(bg) { return String(bg || '').replace('-', '−'); }
    function gmaps(lat, lng) { return 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng; }
    function popupHtml(title, sub, lat, lng, note) {
      return '<div class="bb-pop"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small>' +
        '<a href="' + gmaps(lat, lng) + '" target="_blank" rel="noopener">🗺 Open in Google Maps</a>' +
        (note ? '<small style="margin-top:6px">' + esc(note) + '</small>' : '') + '</div>';
    }

    async function initMap() {
      if (!(await Auth.enforceAnyRole(['hospital', 'admin']))) return;
      if (typeof L === 'undefined') {
        document.getElementById('leafletMap').innerHTML = '<p style="padding:1rem;color:var(--text-muted);font-size:0.85rem;">The map could not be loaded (check your internet connection). Everything else still works.</p>';
        toast('The map library could not be loaded. Check your internet connection.', 'error');
        return;
      }
      const back = document.querySelector('.nav-right .btn-nav-outline');
      if (back) back.href = Auth.roleHome(Auth.getRole());
      map = L.map('leafletMap', { zoomControl: false }).setView([22.9734, 78.6569], 5);
      L.control.zoom({ position: 'bottomleft' }).addTo(map);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      layer = L.layerGroup().addTo(map);
      document.getElementById('mapSearch').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
      await refresh();
      setInterval(refresh, 30000);
    }

    async function refresh() {
      try {
        data = await Auth.apiFetch('/map/data');
        render();
      } catch (e) {
        toast(String(e.message || e), 'error');
      }
    }

    function visibleDonors() {
      return (data.donors || []).filter((d) => {
        if (activeFilter === 'available' && !d.available) return false;
        if (activeFilter === 'critical' && d.blood_group !== 'O-') return false;
        if (activeFilter === 'nearby' && !(d.distance_km != null && d.distance_km < 2)) return false;
        if (query) {
          const hay = (d.label + ' ' + d.blood_group + ' ' + (d.area || '')).toLowerCase();
          if (!hay.includes(query.replace('−', '-'))) return false;
        }
        return true;
      });
    }

    function render() {
      if (!data) return;
      layer.clearLayers();
      markerFor.clear();
      const pts = [];
      const center = data.center ? [data.center.lat, data.center.lng] : null;

      if (center) {
        L.circle(center, { radius: 5000, color: '#c8102e', weight: 1, fillOpacity: 0.04 }).addTo(layer);
        L.circle(center, { radius: 10000, color: '#c8102e', weight: 1, dashArray: '6 6', fill: false }).addTo(layer);
        pts.push(center);
      }

      (data.hospitals || []).forEach((h) => {
        const icon = L.divIcon({ className: '', html: '<div class="bb-pin">🏥</div>', iconSize: [34, 34], iconAnchor: [17, 17] });
        L.marker([h.lat, h.lng], { icon, title: h.name }).addTo(layer)
          .bindPopup(popupHtml(h.name + (h.is_me ? ' (you)' : ''), [h.type, h.city, h.verified ? 'Verified ✓' : 'Not yet verified'].filter(Boolean).join(' · '), h.lat, h.lng));
        pts.push([h.lat, h.lng]);
      });

      (data.requests || []).forEach((r) => {
        if (r.lat == null || r.lng == null) return;
        const icon = L.divIcon({ className: '', html: '<div class="bb-pin bb-req">' + esc(pretty(r.blood_group)) + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] });
        L.marker([r.lat, r.lng], { icon, zIndexOffset: 1000 }).addTo(layer)
          .bindPopup(popupHtml(pretty(r.blood_group) + ' · ' + r.units + ' unit(s) · ' + r.urgency, (r.hospital_name || '') + ' · ' + r.status, r.lat, r.lng));
        pts.push([r.lat, r.lng]);
      });

      const donors = visibleDonors();
      donors.forEach((d, i) => {
        const color = d.available ? '#1db954' : '#5a6472';
        const m = L.circleMarker([d.lat, d.lng], { radius: 9, color, weight: 2, fillColor: color, fillOpacity: d.available ? 0.55 : 0.25 }).addTo(layer);
        m.bindPopup(popupHtml(d.label + ' · ' + pretty(d.blood_group),
          (d.available ? 'Available' : 'Unavailable') + (d.distance_km != null ? ' · ≈' + d.distance_km + ' km' : ''),
          d.lat, d.lng, 'Location is approximate (~1 km) to protect donor privacy.'));
        markerFor.set(i, m);
        pts.push([d.lat, d.lng]);
      });

      renderSidebar(donors);
      renderHeader(center);

      if (firstFit) {
        firstFit = false;
        if (center) map.fitBounds(L.latLng(center[0], center[1]).toBounds(22000), { padding: [20, 20] });
        else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
      }
    }

    function renderHeader(center) {
      const s = data.summary || {};
      document.getElementById('donorCount').textContent =
        (s.donors_total || 0) + ' donors on map · ' + (s.donors_available || 0) + ' available' +
        (center ? ' · ' + (s.donors_within_10km || 0) + ' within 10 km' : '');
      document.getElementById('liveBadge').textContent = 'Live · ' + (s.donors_total || 0) + ' donors';
      const me = (data.hospitals || []).find((h) => h.is_me);
      document.getElementById('cityBadge').textContent = '📍 ' + (me ? (me.city || me.name) : 'All hospitals');

      const box = document.getElementById('activeReqBox');
      const r = (data.requests || [])[0];
      if (r) {
        box.style.display = '';
        document.getElementById('arTitle').textContent = pretty(r.blood_group) + ' · ' + r.units + ' unit(s) · ' + r.urgency;
        document.getElementById('arMeta').textContent = 'Status: ' + r.status + (center ? ' · Rings: 5 km / 10 km' : '');
      } else {
        box.style.display = 'none';
      }
    }

    function renderSidebar(donors) {
      const list = document.getElementById('donorList');
      list.innerHTML = '';
      if (!donors.length) {
        const msg = (data.donors || []).length
          ? 'No donors match this filter.'
          : 'No donors have shared their location yet.';
        list.innerHTML = '<div class="map-empty">' + msg + '</div>';
        return;
      }
      donors.forEach((d, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'donor-pin-item';
        b.setAttribute('aria-label', 'Donor ' + d.label + ', ' + d.blood_group + (d.distance_km != null ? ', ' + d.distance_km + ' kilometres' : ''));
        b.innerHTML =
          '<div class="pin-dot ' + (d.available ? 'available' : 'offline') + '" aria-hidden="true"></div>' +
          '<div class="pin-body"><div class="pin-name">' + esc(d.label) +
          ' <span style="font-family:var(--font-mono);font-size:0.7rem;color:var(--red-bright);">' + esc(pretty(d.blood_group)) + '</span></div>' +
          '<div class="pin-meta">' + esc(d.area || 'Location shared') + ' · ' + (d.available ? 'available' : 'unavailable') + '</div></div>' +
          '<div class="pin-dist">' + (d.distance_km != null ? '≈' + d.distance_km + ' km' : '') + '</div>';
        b.addEventListener('click', () => { const m = markerFor.get(i); map.setView([d.lat, d.lng], 14); if (m) m.openPopup(); });
        list.appendChild(b);
      });
    }

    function filterMap(f, el) {
      activeFilter = f;
      document.querySelectorAll('.filter-chip').forEach((c) => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
      el.classList.add('active');
      el.setAttribute('aria-pressed', 'true');
      render();
    }

    function toast(msg, type = 'success') {
      const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
      document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
    }

    initMap();
  </script>
  <script src="../JS/shared-theme.js"></script>
</body>
</html>
